spring:
  application:
    name: order-management-service

  profiles:
    active:
      - default

  datasource:
    url: jdbc:h2:mem:omsdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  lifecycle:
    timeout-per-shutdown-phase: 30s


server:
  shutdown: graceful


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    circuitbreakers:
      enabled: true   # Enables CB health indicator

  observations:
    enabled: true

  tracing:
    enabled: true
    sampling:
      probability: 1.0

  otlp:
    tracing:
      enabled: false
      endpoint: http://localhost:4317

  metrics:
    tags:
      application: order-management-service

    distribution:
      percentiles-histogram:
        http.server.requests: true

      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [traceId=%X{traceId}, spanId=%X{spanId}, corrId=%X{correlationId}] - %msg%n"


# =========================
# Resilience4j Configuration
# =========================

resilience4j:
  retry:
    instances:
      inventoryRetry:
        maxAttempts: 3
        waitDuration: 2s
  circuitbreaker:
    instances:
      paymentCircuit:
        slidingWindowSize: 3
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2